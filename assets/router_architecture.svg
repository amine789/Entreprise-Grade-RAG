<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d5a73"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="610" fill="#ffffff"/>

  <!-- ============ USER QUERY ============ -->
  <!-- speech bubble -->
  <path d="M108,238 h48 a8,8 0 0 1 8,8 v22 a8,8 0 0 1 -8,8 h-30 l-10,10 v-10 h-8 a8,8 0 0 1 -8,-8 v-22 a8,8 0 0 1 8,-8 z"
        fill="#f4f6f8" stroke="#8fa4b8" stroke-width="2"/>

  <!-- person icon -->
  <circle cx="90" cy="300" r="20" fill="none" stroke="#2c4257" stroke-width="3"/>
  <path d="M55,352 a35,35 0 0 1 70,0" fill="none" stroke="#2c4257" stroke-width="3"/>

  <text x="90" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">USER QUERY</text>

  <line x1="130" y1="308" x2="200" y2="308" stroke="#3d5a73" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ LLM ROUTER (cloud + brain) ============ -->
  <path d="M225,300
           a22,22 0 0 1 20,-32
           a26,26 0 0 1 50,-6
           a22,22 0 0 1 22,38
           a20,20 0 0 1 -6,40 h-80 a20,20 0 0 1 -6,-40 z"
        fill="#eef2f5" stroke="#3d5a73" stroke-width="2.5"/>
  <!-- brain squiggle -->
  <path d="M250,282 q-8,-8 0,-14 q6,-6 12,0 q6,-8 14,0 q8,6 0,14 q8,8 -2,16 q-6,8 -14,2 q-8,6 -14,-2 q-8,-6 4,-16 z"
        fill="none" stroke="#4a7a8c" stroke-width="2"/>
  <line x1="262" y1="270" x2="262" y2="298" stroke="#4a7a8c" stroke-width="1.5"/>

  <text x="272" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">LLM-BASED</text>
  <text x="272" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">ROUTER</text>
  <text x="272" y="406" text-anchor="middle" font-size="11" fill="#64748b">Classification</text>

  <!-- fan-out arrows -->
  <path d="M330,300 C400,300 400,130 470,130" fill="none" stroke="#3d5a73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="335" y1="308" x2="470" y2="308" stroke="#3d5a73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M330,316 C400,316 400,500 470,500" fill="none" stroke="#3d5a73" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- route labels -->
  <text x="420" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">HUMAN_RESOURCES_QUERY</text>
  <text x="420" y="127" text-anchor="middle" font-size="11" fill="#64748b">Route</text>

  <text x="420" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">10K_DOCUMENT_QUERY</text>
  <text x="420" y="305" text-anchor="middle" font-size="11" fill="#64748b">Route</text>

  <text x="405" y="470" text-anchor="middle" font-size="11" fill="#64748b">External Fallback</text>
  <text x="420" y="497" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">WEB_SEARCH</text>
  <text x="420" y="512" text-anchor="middle" font-size="11" fill="#64748b">Route</text>

  <!-- ============ BOX 1: HR docs ============ -->
  <rect x="545" y="90" width="290" height="80" rx="10" fill="#eef2f5" stroke="#8fa4b8" stroke-width="2"/>
  <!-- document icon -->
  <rect x="562" y="112" width="26" height="34" rx="2" fill="#ffffff" stroke="#3d5a73" stroke-width="2"/>
  <line x1="568" y1="121" x2="582" y2="121" stroke="#3d5a73" stroke-width="1.5"/>
  <line x1="568" y1="128" x2="582" y2="128" stroke="#3d5a73" stroke-width="1.5"/>
  <line x1="568" y1="135" x2="578" y2="135" stroke="#3d5a73" stroke-width="1.5"/>
  <!-- db cylinder -->
  <ellipse cx="805" cy="112" rx="14" ry="6" fill="#ffffff" stroke="#4a7a8c" stroke-width="2"/>
  <path d="M791,112 v20 a14,6 0 0 0 28,0 v-20" fill="#ffffff" stroke="#4a7a8c" stroke-width="2"/>
  <ellipse cx="805" cy="132" rx="14" ry="6" fill="none" stroke="#4a7a8c" stroke-width="1.5"/>

  <text x="695" y="112" text-anchor="middle" font-size="11" fill="#64748b">QDRANT (VECTOR DB)</text>
  <text x="695" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">INTERNAL HR POLICY DOCS</text>

  <text x="695" y="196" text-anchor="middle" font-size="11" fill="#64748b">Data Partitioning</text>
  <text x="695" y="214" text-anchor="middle" font-size="11" fill="#334155">PTO &amp; benefits, Payroll,</text>
  <text x="695" y="230" text-anchor="middle" font-size="11" fill="#334155">Employee handbook</text>

  <!-- ============ BOX 2: 10-K filings ============ -->
  <rect x="545" y="270" width="290" height="80" rx="10" fill="#eef2f5" stroke="#8fa4b8" stroke-width="2"/>
  <rect x="562" y="292" width="26" height="34" rx="2" fill="#ffffff" stroke="#3d5a73" stroke-width="2"/>
  <line x1="568" y1="301" x2="582" y2="301" stroke="#3d5a73" stroke-width="1.5"/>
  <line x1="568" y1="308" x2="582" y2="308" stroke="#3d5a73" stroke-width="1.5"/>
  <line x1="568" y1="315" x2="578" y2="315" stroke="#3d5a73" stroke-width="1.5"/>
  <ellipse cx="805" cy="292" rx="14" ry="6" fill="#ffffff" stroke="#4a7a8c" stroke-width="2"/>
  <path d="M791,292 v20 a14,6 0 0 0 28,0 v-20" fill="#ffffff" stroke="#4a7a8c" stroke-width="2"/>
  <ellipse cx="805" cy="312" rx="14" ry="6" fill="none" stroke="#4a7a8c" stroke-width="1.5"/>

  <text x="695" y="292" text-anchor="middle" font-size="11" fill="#64748b">QDRANT (VECTOR DB)</text>
  <text x="695" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">UBER &amp; LYFT 10-K FILINGS</text>

  <text x="695" y="376" text-anchor="middle" font-size="11" fill="#64748b">Data Partitioning</text>
  <text x="695" y="394" text-anchor="middle" font-size="11" fill="#334155">Financial performance, Revenue,</text>
  <text x="695" y="410" text-anchor="middle" font-size="11" fill="#334155">Operating metrics</text>

  <!-- ============ BOX 3: web search ============ -->
  <rect x="545" y="460" width="290" height="80" rx="10" fill="#eef2f5" stroke="#8fa4b8" stroke-width="2"/>
  <!-- globe -->
  <circle cx="575" cy="500" r="16" fill="#ffffff" stroke="#4a7a8c" stroke-width="2"/>
  <ellipse cx="575" cy="500" rx="7" ry="16" fill="none" stroke="#4a7a8c" stroke-width="1.3"/>
  <line x1="559" y1="500" x2="591" y2="500" stroke="#4a7a8c" stroke-width="1.3"/>
  <!-- magnifier -->
  <circle cx="805" cy="496" r="12" fill="#ffffff" stroke="#3d5a73" stroke-width="2"/>
  <line x1="814" y1="505" x2="824" y2="515" stroke="#3d5a73" stroke-width="2.5" stroke-linecap="round"/>

  <text x="695" y="490" text-anchor="middle" font-size="11" fill="#64748b">SERPAPI (GOOGLE)</text>
  <text x="695" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">LIVE WEB SEARCH</text>

  <text x="695" y="566" text-anchor="middle" font-size="11" fill="#64748b">External Fallback</text>
  <text x="695" y="584" text-anchor="middle" font-size="11" fill="#334155">Current events, Comparisons,</text>
  <text x="695" y="600" text-anchor="middle" font-size="11" fill="#334155">General knowledge</text>

  <!-- ============ converge to final response ============ -->
  <path d="M835,130 C900,130 900,308 950,308" fill="none" stroke="#3d5a73" stroke-width="2.5"/>
  <line x1="835" y1="310" x2="950" y2="308" stroke="#3d5a73" stroke-width="2.5"/>
  <path d="M835,500 C900,500 900,308 950,308" fill="none" stroke="#3d5a73" stroke-width="2.5"/>
  <line x1="950" y1="308" x2="985" y2="308" stroke="#3d5a73" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- output speech bubbles -->
  <path d="M978,270 h28 a6,6 0 0 1 6,6 v16 a6,6 0 0 1 -6,6 h-8 l8,10 l-16,-10 h-12 a6,6 0 0 1 -6,-6 v-16 a6,6 0 0 1 6,-6 z"
        fill="#f4f6f8" stroke="#4a7a8c" stroke-width="2"/>
  <path d="M1000,258 h20 a5,5 0 0 1 5,5 v12 a5,5 0 0 1 -5,5 h-6 l6,8 l-13,-8 h-7 a5,5 0 0 1 -5,-5 v-12 a5,5 0 0 1 5,-5 z"
        fill="#f4f6f8" stroke="#4a7a8c" stroke-width="1.5"/>

  <text x="990" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">FINAL RESPONSE</text>
  <text x="990" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">GENERATION</text>
  <text x="990" y="392" text-anchor="middle" font-size="11" fill="#64748b">Output</text>
</svg>
