<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Enterprise RAG Routing Architecture</text>

  <!-- User Query -->
  <rect x="400" y="55" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="85" text-anchor="middle" font-size="14" fill="#1e293b">User Query</text>

  <!-- route_query -->
  <rect x="325" y="145" width="350" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="500" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">LLM-Based Router (route_query)</text>
  <text x="500" y="189" text-anchor="middle" font-size="12" fill="#4338ca">classifies intent into one of three routes</text>

  <line x1="500" y1="105" x2="500" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- three branches -->
  <rect x="20" y="265" width="280" height="70" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="160" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#164e63">HUMAN_RESOURCES_QUERY</text>
  <text x="160" y="308" text-anchor="middle" font-size="11" fill="#0e7490">internal HR policy docs</text>
  <text x="160" y="323" text-anchor="middle" font-size="11" fill="#0e7490">(PTO, benefits, payroll, handbook)</text>

  <rect x="360" y="265" width="280" height="70" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="500" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#164e63">10K_DOCUMENT_QUERY</text>
  <text x="500" y="308" text-anchor="middle" font-size="11" fill="#0e7490">Uber / Lyft 10-K filings</text>
  <text x="500" y="323" text-anchor="middle" font-size="11" fill="#0e7490">(revenue, operating costs)</text>

  <rect x="700" y="265" width="280" height="70" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="840" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">WEB_SEARCH</text>
  <text x="840" y="308" text-anchor="middle" font-size="11" fill="#c2410c">everything else</text>
  <text x="840" y="323" text-anchor="middle" font-size="11" fill="#c2410c">live web fallback via SerpApi</text>

  <line x1="420" y1="205" x2="160" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="205" x2="500" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="205" x2="840" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Qdrant collections -->
  <rect x="20" y="375" width="280" height="46" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="403" text-anchor="middle" font-size="12" fill="#1e293b">Qdrant: hr_data</text>

  <rect x="360" y="375" width="280" height="46" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="403" text-anchor="middle" font-size="12" fill="#1e293b">Qdrant: 10k_data</text>

  <line x1="160" y1="335" x2="160" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="335" x2="500" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- final response generation -->
  <rect x="330" y="460" width="340" height="60" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="500" y="485" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Final Response Generation</text>
  <text x="500" y="504" text-anchor="middle" font-size="12" fill="#15803d">grounded, cited answer -- one coherent output</text>

  <line x1="160" y1="421" x2="420" y2="460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="421" x2="500" y2="460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="335" x2="840" y2="490" stroke="#64748b" stroke-width="2"/>
  <line x1="840" y1="490" x2="670" y2="490" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
