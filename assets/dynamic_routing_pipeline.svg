<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Dynamic Routing Pipeline</text>

  <!-- User Query -->
  <rect x="400" y="50" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="80" text-anchor="middle" font-size="14" fill="#1e293b">User Query</text>

  <!-- route_query -->
  <rect x="350" y="140" width="300" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="500" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">route_query()</text>
  <text x="500" y="184" text-anchor="middle" font-size="12" fill="#4338ca">Claude classifies intent</text>

  <line x1="500" y1="100" x2="500" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- three branches -->
  <rect x="20" y="260" width="280" height="60" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="160" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#164e63">ANTHROPIC_QUERY</text>
  <text x="160" y="302" text-anchor="middle" font-size="11" fill="#0e7490">Claude / Anthropic docs</text>

  <rect x="360" y="260" width="280" height="60" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="500" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#164e63">10K_DOCUMENT_QUERY</text>
  <text x="500" y="302" text-anchor="middle" font-size="11" fill="#0e7490">Uber / Lyft 10-K filings</text>

  <rect x="700" y="260" width="280" height="60" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="840" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">WEB_SEARCH</text>
  <text x="840" y="302" text-anchor="middle" font-size="11" fill="#c2410c">everything else</text>

  <line x1="420" y1="200" x2="160" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="200" x2="500" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="200" x2="840" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- retrieve_and_response -->
  <rect x="330" y="380" width="340" height="60" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="500" y="405" text-anchor="middle" font-size="14" font-weight="600" fill="#164e63">retrieve_and_response()</text>
  <text x="500" y="424" text-anchor="middle" font-size="12" fill="#0e7490">embed query, search Qdrant</text>

  <line x1="160" y1="320" x2="420" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="320" x2="500" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Qdrant -->
  <rect x="330" y="470" width="340" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="491" text-anchor="middle" font-size="13" fill="#1e293b">Qdrant: top-3 chunks</text>
  <text x="500" y="508" text-anchor="middle" font-size="11" fill="#475569">payload = content + source + page</text>

  <line x1="500" y1="440" x2="500" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- rag_formatted_response -->
  <rect x="330" y="560" width="340" height="60" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="500" y="585" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">rag_formatted_response()</text>
  <text x="500" y="604" text-anchor="middle" font-size="12" fill="#15803d">Claude answers with [1][2][3] citations</text>

  <line x1="500" y1="520" x2="500" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Answer -->
  <rect x="380" y="655" width="240" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="680" text-anchor="middle" font-size="13" fill="#1e293b">Answer</text>

  <line x1="500" y1="620" x2="500" y2="655" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- web search bypass to answer -->
  <polyline points="840,320 840,675 620,675" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
