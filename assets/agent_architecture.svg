<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="A user query enters the Claude agent loop, which calls the search_hr_docs, search_10k_docs, and search_web tools, reads each result, repeats as needed, then exits with a cited answer.">
  <title>Enterprise RAG agent architecture: query enters an agent loop that calls HR, 10-K, and web-search tools, then exits with a cited answer</title>
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d5a73"/>
    </marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94724a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="600" fill="#ffffff"/>

  <!-- ============ USER QUERY ============ -->
  <rect x="40" y="250" width="160" height="70" rx="10" fill="#f4f6f8" stroke="#8fa4b8" stroke-width="2"/>
  <circle cx="80" cy="273" r="13" fill="none" stroke="#2c4257" stroke-width="2.6"/>
  <path d="M60,308 a20,20 0 0 1 40,0" fill="none" stroke="#2c4257" stroke-width="2.6"/>
  <text x="112" y="284" font-size="13" font-weight="700" fill="#1a1a2e">User Query</text>
  <text x="112" y="301" font-size="10.5" fill="#64748b">asks a question</text>

  <line x1="200" y1="285" x2="292" y2="285" stroke="#3d5a73" stroke-width="2.2" marker-end="url(#arrC)"/>
  <text x="246" y="277" text-anchor="middle" font-size="10.5" fill="#3d5a73">asks</text>

  <!-- ============ CLAUDE AGENT LOOP ============ -->
  <rect x="300" y="210" width="220" height="150" rx="14" fill="#fdf3ea" stroke="#94724a" stroke-width="2.5"/>

  <!-- refresh/cycle icon = the loop, drawn as the icon itself rather than decoration -->
  <path d="M410,235 A20,20 0 1 1 390,255" fill="none" stroke="#94724a" stroke-width="3" stroke-linecap="round"/>
  <polygon points="390,242 379,262 401,262" fill="#94724a"/>

  <text x="410" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a2e">CLAUDE AGENT LOOP</text>
  <text x="410" y="320" text-anchor="middle" font-size="10.5" fill="#94724a">reasons, calls a tool,</text>
  <text x="410" y="334" text-anchor="middle" font-size="10.5" fill="#94724a">reads result, repeats</text>

  <!-- ============ TOOL 1: HR docs ============ -->
  <rect x="680" y="60" width="320" height="80" rx="10" fill="#eef2f5" stroke="#8fa4b8" stroke-width="2"/>
  <rect x="700" y="83" width="26" height="34" rx="2" fill="#ffffff" stroke="#3d5a73" stroke-width="2"/>
  <line x1="707" y1="92" x2="719" y2="92" stroke="#3d5a73" stroke-width="1.5"/>
  <line x1="707" y1="99" x2="719" y2="99" stroke="#3d5a73" stroke-width="1.5"/>
  <line x1="707" y1="106" x2="715" y2="106" stroke="#3d5a73" stroke-width="1.5"/>
  <text x="760" y="92" font-size="10.5" fill="#64748b">TOOL</text>
  <text x="760" y="112" font-size="13" font-weight="700" fill="#1a1a2e">search_hr_docs</text>
  <text x="760" y="128" font-size="10.5" fill="#334155">Qdrant &#183; employee handbook</text>

  <!-- ============ TOOL 2: 10-K filings ============ -->
  <rect x="680" y="245" width="320" height="80" rx="10" fill="#eef2f5" stroke="#8fa4b8" stroke-width="2"/>
  <rect x="700" y="268" width="26" height="34" rx="2" fill="#ffffff" stroke="#3d5a73" stroke-width="2"/>
  <line x1="707" y1="277" x2="719" y2="277" stroke="#3d5a73" stroke-width="1.5"/>
  <line x1="707" y1="284" x2="719" y2="284" stroke="#3d5a73" stroke-width="1.5"/>
  <line x1="707" y1="291" x2="715" y2="291" stroke="#3d5a73" stroke-width="1.5"/>
  <text x="760" y="277" font-size="10.5" fill="#64748b">TOOL</text>
  <text x="760" y="297" font-size="13" font-weight="700" fill="#1a1a2e">search_10k_docs</text>
  <text x="760" y="313" font-size="10.5" fill="#334155">Qdrant &#183; Uber &amp; Lyft 10-Ks</text>

  <!-- ============ TOOL 3: web search ============ -->
  <rect x="680" y="430" width="320" height="80" rx="10" fill="#eef2f5" stroke="#8fa4b8" stroke-width="2"/>
  <circle cx="716" cy="470" r="15" fill="#ffffff" stroke="#4a7a8c" stroke-width="2"/>
  <ellipse cx="716" cy="470" rx="6.5" ry="15" fill="none" stroke="#4a7a8c" stroke-width="1.3"/>
  <line x1="701" y1="470" x2="731" y2="470" stroke="#4a7a8c" stroke-width="1.3"/>
  <circle cx="733" cy="484" r="9" fill="#ffffff" stroke="#3d5a73" stroke-width="1.6"/>
  <path d="M729,484 l3,3.5 l6,-7" fill="none" stroke="#3d5a73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="760" y="452" font-size="10.5" fill="#64748b">TOOL</text>
  <text x="760" y="472" font-size="13" font-weight="700" fill="#1a1a2e">search_web</text>
  <text x="760" y="488" font-size="10.5" fill="#334155">Firecrawl + LLM relevance grading</text>

  <!-- ============ call / result, one line per tool, both directions marked ============ -->
  <line x1="520" y1="240" x2="680" y2="100" stroke="#3d5a73" stroke-width="2.2" marker-start="url(#arrC)" marker-end="url(#arrC)"/>
  <text x="560" y="163" font-size="10.5" fill="#3d5a73">call &#183; result</text>

  <line x1="520" y1="285" x2="680" y2="285" stroke="#3d5a73" stroke-width="2.2" marker-start="url(#arrC)" marker-end="url(#arrC)"/>
  <text x="600" y="275" text-anchor="middle" font-size="10.5" fill="#3d5a73">call &#183; result</text>

  <line x1="520" y1="330" x2="680" y2="470" stroke="#3d5a73" stroke-width="2.2" marker-start="url(#arrC)" marker-end="url(#arrC)"/>
  <text x="560" y="415" font-size="10.5" fill="#3d5a73">call &#183; result</text>

  <!-- ============ exit the loop once satisfied ============ -->
  <line x1="410" y1="360" x2="410" y2="452" stroke="#94724a" stroke-width="2.4" stroke-dasharray="1 5" marker-end="url(#arrE)"/>
  <text x="430" y="400" font-size="10.5" fill="#94724a">exits loop once it</text>
  <text x="430" y="414" font-size="10.5" fill="#94724a">has enough to answer</text>

  <!-- ============ ANSWER ============ -->
  <rect x="300" y="460" width="220" height="80" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="410" y="497" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">ANSWER</text>
  <text x="410" y="515" text-anchor="middle" font-size="10.5" fill="#166534">grounded + cited from every</text>
  <text x="410" y="528" text-anchor="middle" font-size="10.5" fill="#166534">tool call made</text>
</svg>
